receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 1000
    timeout: 1s

exporters:
  otlp/signoz:
    endpoint: ${SIGNOZ_OTLP_ENDPOINT:-signoz-otel-collector:4317}
    tls:
      insecure: true
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, logging]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, logging]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, logging]
